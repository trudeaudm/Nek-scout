services:
  # Main web application
  - type: web
    name: nek-scout
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: ./scripts/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
    autoDeploy: true
