databases:
  - name: nek-scout-db
    databaseName: nekscout
    user: nekscout
    plan: free

services:
  # Main web application
  - type: web
    name: nek-scout
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: bash scripts/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nek-scout-db
          property: connectionString
      - key: IMPORT_MIN_ACRES
        value: "5"
    autoDeploy: true

  # Automated data updates (daily at 2am UTC)
  # Note: Render Cron Jobs require a paid instance type (not available on free).
  - type: cron
    name: nek-scout-updater
    runtime: node
    schedule: "0 2 * * *"
    buildCommand: npm install && npx prisma generate
    startCommand: npm run auto-update
    envVars:
      - key: NODE_ENV
        value: production
      - key: FORCE_UPDATE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: nek-scout-db
          property: connectionString
