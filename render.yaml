databases:
  - name: nek-scout-db
    databaseName: nekscout
    user: nekscout
    plan: free

services:
  # Main web application
  - type: web
    name: nek-scout
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nek-scout-db
          property: connectionString
    autoDeploy: true
    
  # Automated data updates (runs weekly)
  - type: cron
    name: nek-scout-updater
    runtime: node
    plan: free
    schedule: "0 2 * * 0"
    buildCommand: npm install && npx prisma generate
    startCommand: npm run auto-update
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nek-scout-db
          property: connectionString
