databases:
  - name: nek-scout-db
    databaseName: nekscout
    user: nekscout
    plan: free

services:
  # Main web application
  - type: web
    name: nek-scout
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: bash scripts/start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nek-scout-db
          property: connectionString
      - key: IMPORT_MIN_ACRES
        value: "5"
    autoDeploy: true

# Daily VCGI refresh (nek-scout-updater, "0 2 * * *", startCommand: npm run auto-update)
# is intentionally not declared. Render cron jobs require a paid plan (0.5c-512mb).
# Including one on a free workspace fails Blueprint sync and blocks this web service.
